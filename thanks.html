<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تأكيد الطلب - فن كسب القلوب</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background: linear-gradient(rgba(0, 0, 0, 0.6), rgba(0, 0, 0, 0.6)), url('https://images.unsplash.com/photo-1518156269907-76c198aa3459?q=80&w=1000&auto=format&fit=crop');
            background-size: cover;
            background-position: center;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #fff;
            padding: 20px;
        }
        .card {
            background: rgba(15, 15, 15, 0.85);
            backdrop-filter: blur(12px);
            padding: 40px 30px;
            border-radius: 20px;
            max-width: 500px;
            width: 100%;
            text-align: center;
            box-shadow: 0 15px 30px rgba(0,0,0,0.6);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        h1 {
            color: #ffda79;
            font-size: 28px;
            margin-bottom: 15px;
        }
        p {
            color: #f1f2f6;
            font-size: 16px;
            line-height: 1.8;
            margin-bottom: 25px;
        }
        .highlight {
            color: #ffda79;
            font-weight: bold;
        }
        .btn {
            display: inline-block;
            background: #25D366;
            color: white;
            padding: 14px 30px;
            border-radius: 50px;
            text-decoration: none;
            font-weight: bold;
            font-size: 16px;
            box-shadow: 0 5px 15px rgba(37, 211, 102, 0.4);
            transition: 0.3s;
        }
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(37, 211, 102, 0.6);
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>شكراً لثقتكِ!</h1>
        <p>أنتِ على بعد خطوة واحدة من الحصول على <span class="highlight">دليل فن كسب القلوب</span>.</p>
        <p>اضعلي بالزر أسفله لإتمام التواصل وتأكيد الاستلام عبر الواتساب مباشرة.</p>
        
        <a href="https://wa.me/212776636639?text=سلام، راني أكدت الطلب وبغيت نتواصل معك بخصوص دليل فن كسب القلوب" class="btn" target="_blank">تواصل معي عبر الواتساب الآن</a>
    </div>

</body>
</html>
