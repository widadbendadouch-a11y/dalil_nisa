<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>دليل فن كسب القلوب</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background: linear-gradient(rgba(0, 0, 0, 0.5), rgba(0, 0, 0, 0.5)), url('https://images.unsplash.com/photo-1518156269907-76c198aa3459?q=80&w=1000&auto=format&fit=crop');
            background-size: cover;
            background-position: center;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #fff;
            padding: 20px;
        }
        .card {
            background: rgba(15, 15, 15, 0.85);
            backdrop-filter: blur(12px);
            padding: 35px;
            border-radius: 20px;
            max-width: 500px;
            width: 100%;
            text-align: center;
            box-shadow: 0 15px 30px rgba(0,0,0,0.6);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        h1 {
            color: #ffda79;
            font-size: 26px;
            margin-bottom: 15px;
        }
        p {
            color: #f1f2f6;
            font-size: 15px;
            line-height: 1.8;
            margin-bottom: 20px;
        }
        .price {
            color: #ffda79;
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 20px;
        }
        .btn {
            display: inline-block;
            background: #25D366;
            color: white;
            padding: 14px 30px;
            border-radius: 50px;
            text-decoration: none;
            font-weight: bold;
            font-size: 16px;
            box-shadow: 0 5px 15px rgba(37, 211, 102, 0.4);
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>فن كسب القلوب</h1>
        <p>اكتشفي أسرار العلاقات الذكية وكيف تجعلين الرجل يتعلق بك بحرارة وبوعي تام. هذا الدليل هو مفتاحك لعلاقة ناجحة ومستدامة.</p>
        <div class="price">ثمن النسخة: 5 أورو فقط</div>
        <a href="https://wa.me/212776636639?text=سلام، بغيت نشري دليل فن كسب القلوب" class="btn" target="_blank">احصلي على نسختك عبر الواتساب</a>
    </div>

</body>
</html>
