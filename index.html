<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>دليل 3% من النساء</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background: linear-gradient(rgba(0, 0, 0, 0.45), rgba(0, 0, 0, 0.45)), url('https://images.unsplash.com/photo-1522673607200-164d1b6ce486?q=80&w=1000&auto=format&fit=crop');
            background-size: cover;
            background-position: center;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #fff;
            padding: 20px;
        }
        .landing-card {
            background: rgba(15, 15, 15, 0.75);
            backdrop-filter: blur(14px);
            padding: 35px;
            border-radius: 24px;
            max-width: 550px;
            width: 100%;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
            border: 1px solid rgba(255, 255, 255, 0.15);
            text-align: center;
        }
        h1 {
            font-size: 28px;
            margin-bottom: 15px;
            color: #ffda79;
        }
        p {
            font-size: 16px;
            line-height: 1.8;
            color: #f5f6fa;
            margin-bottom: 25px;
        }
        .btn {
            display: inline-block;
            background: linear-gradient(135deg, #e056fd, #686de0);
            color: white;
            padding: 12px 30px;
            border-radius: 50px;
            text-decoration: none;
            font-weight: bold;
            transition: 0.3s;
            box-shadow: 0 5px 15px rgba(224, 86, 253, 0.4);
        }
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(224, 86, 253, 0.6);
        }
    </style>
</head>
<body>

    <div class="landing-card">
        <h1>دليل 3% من النساء</h1>
        <p>مساحتك الخاصة للتطوير، التميز، وبناء الشخصية الواثقة. اكتبي خطوتك الأولى نحو النسخة الأفضل منكِ بكل وعي وقوة.</p>
        <a href="#" class="btn">اكتبي قصتك الآن</a>
    </div>

</body>
</html>
